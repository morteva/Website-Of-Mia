<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
  <meta name="theme-color" content="#08080a" />
  <link rel="canonical" href="https://morteva.com/videos.html" />
  <meta name="description" content="Mia's video gallery." />
  <title>Miaorin Morwen Morteva · Videos</title>
  <link rel="stylesheet" href="/styles.css?v=about-quotes-20260918-r1" />
</head>
<body>
  <header>
    <div class="shell nav">
      <a class="brand" href="/">MIA</a>
      <nav class="nav-links" aria-label="Video navigation">
        <a href="/">Home</a>
        <a href="/gallery.html">Photos</a>
        <a href="/#links">Links</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="intro">
      <div class="eyebrow">Archive</div>
      <h1>Videos.</h1>
      <p>A growing archive of videos I want to keep here on my own site instead of handing everything to somebody else's platform.</p>
    </section>

    <div id="status" class="status">Loading videos…</div>
    <section id="videos" class="video-grid" aria-label="Video gallery" hidden></section>
  </main>

  <footer><div class="shell">Mia · Built from scratch · No beige allowed</div></footer>

  <script>
    const status=document.getElementById('status');
    const grid=document.getElementById('videos');

    async function loadVideos(){
      try{
        const response=await fetch('/video-manifest.json',{cache:'no-cache'});
        if(!response.ok) throw new Error(`Video manifest returned ${response.status}`);
        const {videos=[]}=await response.json();
        if(!videos.length){
          status.textContent='No videos published here yet.';
          return;
        }
        for(const item of videos){
          const card=document.createElement('article');
          card.className='video-card';
          const video=document.createElement('video');
          video.controls=true;
          video.preload='metadata';
          video.playsInline=true;
          video.src=item.url;
          video.addEventListener('play',()=>{
            document.querySelectorAll('video').forEach(other=>{if(other!==video&&!other.paused)other.pause()});
          });
          const title=document.createElement('div');
          title.className='video-title';
          title.textContent=item.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ');
          card.append(video,title);
          grid.appendChild(card);
        }
        status.hidden=true;
        grid.hidden=false;
      }catch(error){
        status.classList.add('error');
        status.textContent='Could not load videos right now. Try again in a moment.';
      }
    }

    loadVideos();
  </script>
</body>
</html>
