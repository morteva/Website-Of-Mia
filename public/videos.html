<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08080a" />
  <meta name="description" content="Mia's video gallery." />
  <title>Mia · Videos</title>
  <style>
    :root{--bg:#08080a;--panel:#111116;--text:#f5f0ee;--muted:#aaa2a0;--line:rgba(255,255,255,.10);--accent:#d4145a;--radius:22px;--shadow:0 30px 90px rgba(0,0,0,.48)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 14% 4%,rgba(212,20,90,.16),transparent 28rem),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit;text-decoration:none}
    .shell{width:min(1180px,calc(100% - 36px));margin:0 auto}
    header{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px);background:linear-gradient(to bottom,rgba(8,8,10,.94),rgba(8,8,10,.66));border-bottom:1px solid var(--line)}
    .nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:22px}.brand{font-size:.92rem;font-weight:900;letter-spacing:.36em}.nav-links{display:flex;gap:22px;color:var(--muted);font-size:.88rem}.nav-links a:hover{color:var(--text)}
    .intro{padding:88px 0 52px}.eyebrow{display:inline-flex;align-items:center;gap:10px;margin-bottom:18px;color:#ddd4d2;font-size:.74rem;font-weight:800;letter-spacing:.19em;text-transform:uppercase}.eyebrow::before{content:"";width:34px;height:1px;background:var(--accent);box-shadow:0 0 18px rgba(212,20,90,.75)}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(4.4rem,13vw,9rem);font-weight:500;line-height:.88;letter-spacing:-.05em}
    .video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:12px 0 92px}.video-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:linear-gradient(145deg,rgba(22,22,28,.9),rgba(13,13,17,.94));box-shadow:0 10px 34px rgba(0,0,0,.17)}.video-card video{display:block;width:100%;background:#000;aspect-ratio:16/9}.video-title{padding:15px 18px 18px;color:#d8d0ce;font-size:.9rem;word-break:break-word}.status{padding:28px 0 92px;color:var(--muted);line-height:1.7}.error{color:#d9a1b6}
    footer{border-top:1px solid var(--line);padding:30px 0 40px;color:#7f7977;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase}
    @media(max-width:760px){.video-grid{grid-template-columns:1fr}.nav-links{gap:12px;font-size:.8rem}}
    @media(max-width:520px){.shell{width:min(100% - 24px,1180px)}.intro{padding-top:58px}.video-grid{padding-bottom:72px}}
  </style>
</head>
<body>
  <header>
    <div class="shell nav">
      <a class="brand" href="/">MIA</a>
      <nav class="nav-links" aria-label="Video navigation">
        <a href="/">Home</a>
        <a href="/gallery.html">Photos</a>
        <a href="/#links">Links</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="intro">
      <div class="eyebrow">Archive</div>
      <h1>Videos.</h1>
    </section>

    <div id="status" class="status">Loading videos…</div>
    <section id="videos" class="video-grid" aria-label="Video gallery" hidden></section>
  </main>

  <footer><div class="shell">Mia · Built from scratch · No beige allowed</div></footer>

  <script>
    const repo='morteva/Website-Of-Mia';
    const branch='main';
    const root='public/videos';
    const videoPattern=/\.(mp4|webm|ogg|m4v)$/i;
    const status=document.getElementById('status');
    const grid=document.getElementById('videos');

    async function loadVideos(){
      try{
        const encoded=root.split('/').map(encodeURIComponent).join('/');
        const response=await fetch(`https://api.github.com/repos/${repo}/contents/${encoded}?ref=${encodeURIComponent(branch)}`,{headers:{Accept:'application/vnd.github+json'}});
        if(!response.ok) throw new Error(`GitHub returned ${response.status}`);
        const entries=await response.json();
        const videos=entries.filter(item=>item.type==='file'&&videoPattern.test(item.name)&&item.download_url).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
        if(!videos.length){
          status.textContent='No videos yet. Add .mp4 files to public/videos in GitHub.';
          return;
        }
        for(const item of videos){
          const card=document.createElement('article');
          card.className='video-card';
          const video=document.createElement('video');
          video.controls=true;
          video.preload='metadata';
          video.playsInline=true;
          video.src=item.download_url;
          video.addEventListener('play',()=>{
            document.querySelectorAll('video').forEach(other=>{if(other!==video&&!other.paused)other.pause()});
          });
          const title=document.createElement('div');
          title.className='video-title';
          title.textContent=item.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ');
          card.append(video,title);
          grid.appendChild(card);
        }
        status.hidden=true;
        grid.hidden=false;
      }catch(error){
        status.classList.add('error');
        status.textContent='Could not load videos from GitHub right now. Try again in a moment.';
      }
    }

    loadVideos();
  </script>
</body>
</html>
