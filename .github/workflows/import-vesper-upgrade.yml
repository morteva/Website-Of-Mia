name: Import verified Vesper upgrade
on:
  push:
    branches: [main]
    paths: ['.vesper-transfer.json']
permissions:
  contents: write
concurrency:
  group: vesper-tiny-mia-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'morteva/Website-Of-Mia'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify and install only the approved mascot assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, re, subprocess, urllib.parse, urllib.request, zipfile
          root = pathlib.Path.cwd()
          config = json.loads((root / '.vesper-transfer.json').read_text())
          parsed = urllib.parse.urlparse(config['download_url'])
          assert parsed.scheme == 'https' and parsed.hostname.endswith('.dropboxusercontent.com'), 'Unexpected download host'
          expected_zip = '03e8007cd83bf338bf18d64495b76c80afcb16c422f00c48ef016e0a59200c47'
          expected = {
            'public/mia-pet.js': '81548c6f098e21685e46ec4a09bd6ce155e776c580f69ba8e8e8c2a777d84c36',
            'public/assets/vesper-spritesheet.webp': '44798786c53c6a12c2a13eb752335310708f6fdb84fcef0736e063a4838f2faa',
            'public/tiny-mia-thoughts.json': '948f300e861a35876023c47f8fd6113da82ac28e6e77c12e6739845f9c5cdfb7'
          }
          def blob(path):
            return subprocess.check_output(['git','hash-object',path],text=True).strip()
          assert blob('public/mia-pet.js') == '9baf2d70d766ba4d55deb561a934473f4fcfdda6', 'Mascot changed since review; refusing overwrite'
          assert blob('public/tiny-mia-thoughts.json') == 'f685b31012d989b63a5d76d237e5f3023f419342', 'Thought bank changed since review'
          with urllib.request.urlopen(config['download_url'], timeout=60) as response:
            payload = response.read(5000001)
          assert len(payload) <= 5000000 and hashlib.sha256(payload).hexdigest() == expected_zip, 'Package checksum mismatch'
          archive = zipfile.ZipFile(io.BytesIO(payload))
          assert set(archive.namelist()) == set(expected) | {'SHA256.json'}, 'Unexpected package contents'
          pending = {}
          for name, digest in expected.items():
            data = archive.read(name)
            assert hashlib.sha256(data).hexdigest() == digest, 'Asset checksum mismatch: ' + name
            pending[name] = data
          bank = json.loads(pending['public/tiny-mia-thoughts.json'])
          assert len(bank['lines']) == 1200 and len({line['text'] for line in bank['lines']}) == 1200
          image = pending['public/assets/vesper-spritesheet.webp']
          assert image[:4] == b'RIFF' and image[8:12] == b'WEBP', 'Not a WebP atlas'
          target = root / 'public/assets/vesper-spritesheet.webp'
          assert not target.exists() or target.read_bytes() == image, 'Unexpected existing artwork'
          for name, data in pending.items():
            path = root / name
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_bytes(data)
            print('Verified asset:', name, len(data), 'bytes')
          subprocess.run(['node','--check','public/mia-pet.js'],check=True)
          loader = root / 'public/orbs.js'
          text = loader.read_text()
          text, count = re.subn(r"script\.src\s*=\s*['\"]/mia-pet\.js(?:\?[^'\"]*)?['\"]", "script.src = '/mia-pet.js?v=vesper-20260909-r1'", text)
          assert count == 1, 'Expected one existing shared mascot loader'
          loader.write_text(text)
          for name in ['public/index.html','public/gallery.html','public/youtube-comments.html']:
            path = root / name
            text, count = re.subn(r'src=[\'\"]/orbs\.js(?:\?[^\'\"]*)?[\'\"]', 'src="/orbs.js?v=vesper-20260909-r1"', path.read_text())
            assert count == 1, 'Expected one orb loader in ' + name
            path.write_text(text)
          (root / '.vesper-transfer.json').unlink()
          print('PASS: upgraded Vesper atlas, 1200 preserved thoughts, three cache-versioned page loaders.')
          PY
      - name: Commit the verified Vesper upgrade
        shell: bash
        run: |
          git config user.name 'Mira and Mia'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mia-pet.js public/assets/vesper-spritesheet.webp public/tiny-mia-thoughts.json public/orbs.js public/index.html public/gallery.html public/youtube-comments.html .vesper-transfer.json
          git commit -m "Upgrade Tiny Mia to Vesper artwork, smooth idle poses and crisp running"
          git push origin HEAD:main
          echo "Installed commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
