name: Import verified Tiny Mia package
on:
  push:
    branches: [main]
    paths: ['.tiny-mia-transfer.json']
permissions:
  contents: write
concurrency:
  group: tiny-mia-package-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'morteva/Website-Of-Mia'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and import only the three approved assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, struct, urllib.request, urllib.error, zipfile
          from urllib.parse import urlsplit
          repo = os.environ['REPO']
          api_root = 'https://api.github.com/repos/' + repo
          def api(path, payload=None, method=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(api_root + path, data=body, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=40) as response:
                  return json.load(response)
          manifest_file = api('/contents/.tiny-mia-transfer.json?ref=' + os.environ['SOURCE_COMMIT'])
          manifest = json.loads(base64.b64decode(manifest_file['content']))
          url = manifest['download_url']
          if urlsplit(url).scheme != 'https':
              raise SystemExit('The transfer must use HTTPS.')
          print('::add-mask::' + url)
          expected_zip = '8938c64219553f1861ddb581473d74cbd7486a4f71b6c282ee157b24dd1a6021'
          try:
              with urllib.request.urlopen(url, timeout=60) as response:
                  package = response.read(2000001)
          except Exception:
              raise SystemExit('Temporary package download failed; request a fresh transfer link.') from None
          if len(package) > 2000000 or hashlib.sha256(package).hexdigest() != expected_zip:
              raise SystemExit('Package checksum mismatch. No repository assets were changed.')
          expected = {
              'public/mia-pet.js': '1d8043f83d3756ca2d9191d0fe71cb20dbaafa5ffe6199e1bd73a017cd952ac3',
              'public/tiny-mia-cat-sprite.png': '65e49a18cef3d72140259bb864b662acb5722b1b84180b25aa4ffd64bc4abc50',
              'public/tiny-mia-thoughts.json': '948f300e861a35876023c47f8fd6113da82ac28e6e77c12e6739845f9c5cdfb7'
          }
          assets = {}
          with zipfile.ZipFile(io.BytesIO(package)) as archive:
              for name, checksum in expected.items():
                  info = archive.getinfo(name)
                  if info.file_size > 1000000:
                      raise SystemExit('Unexpected asset size.')
                  data = archive.read(name)
                  if hashlib.sha256(data).hexdigest() != checksum:
                      raise SystemExit('Asset checksum mismatch: ' + name)
                  assets[name] = data
          png = assets['public/tiny-mia-cat-sprite.png']
          if png[:8] != b'\x89PNG\r\n\x1a\n' or struct.unpack('>II', png[16:24]) != (768, 1386):
              raise SystemExit('Unexpected sprite atlas dimensions.')
          thoughts = json.loads(assets['public/tiny-mia-thoughts.json'])['lines']
          if len(thoughts) != 1200 or len({item['text'] for item in thoughts}) != 1200:
              raise SystemExit('Expected exactly 1200 distinct thought strings.')
          head = api('/git/ref/heads/main')['object']['sha']
          current_js = api('/contents/public/mia-pet.js?ref=' + head)
          if current_js['sha'] != '8973c0b93dda77e0c1472509357a0e6ffb9f53c1':
              raise SystemExit('Pet code changed concurrently; refusing to overwrite it.')
          for name in expected:
              if name == 'public/mia-pet.js':
                  continue
              try:
                  api('/contents/' + name + '?ref=' + head)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              else:
                  raise SystemExit('New asset already exists; refusing to overwrite: ' + name)
          entries = []
          for name, data in assets.items():
              blob = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          latest_manifest = api('/contents/.tiny-mia-transfer.json?ref=' + head)
          if latest_manifest['sha'] != manifest_file['sha']:
              raise SystemExit('Transfer request changed concurrently; no branch changes made.')
          entries.append({'path': '.tiny-mia-transfer.json', 'mode': '100644', 'type': 'blob', 'sha': None})
          base_tree = api('/git/commits/' + head)['tree']['sha']
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = api('/git/commits', {'message': 'Install animated Tiny Mia with original transparent atlas and 1200 thoughts', 'tree': tree['sha'], 'parents': [head]})
          api('/git/refs/heads/main', {'sha': commit['sha'], 'force': False}, 'PATCH')
          print('Verified 3 assets, 768x1386 transparent atlas and 1200 thought strings.')
          print('Imported commit: ' + commit['sha'])
          PY
